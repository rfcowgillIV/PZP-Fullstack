# TEMPORARY: creates package-lock.json once on GitHub's servers and commits it to this branch.
# Removed again in the next commit.
name: Generate lockfile
on:
  push:
    branches: [ "security-updates-2026" ]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Add generated package-lock.json"
          git push
